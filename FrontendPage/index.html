<script type="text/plain" id="code-0" data-lang="csharp">// Verifyer/Verifier/PcrVerifier.cs
// PcrReplayer — 从 TCG 事件日志重放所有 PCR 值
public static class PcrReplayer
{
    /// <summary>
    /// 对日志中所有事件重新执行 extend 操作，返回各 PCR 的期望终值。
    /// 结果键：[算法ID][PCR编号] = 摘要字节
    /// </summary>
    public static Dictionary<ushort, Dictionary<uint, byte[]>> Replay(TcgEventLog log)
    {
        var banks = new Dictionary<ushort, Dictionary<uint, byte[]>>();

        // ── 1. 初始化 PCR banks（全零） ──
        if (log.IsCryptoAgile && log.SpecId != null)
            foreach (var (algId, _) in log.SpecId.AlgorithmList)
                banks[algId] = new Dictionary<uint, byte[]>();
        else
            banks[0x0004] = new Dictionary<uint, byte[]>();

        // ── 2. 检测 StartupLocality ──
        byte startupLocality = DetectStartupLocality(log);
        if (startupLocality != 0)
        {
            foreach (var (algId, bank) in banks)
            {
                var seed = new byte[digestSize];
                seed[digestSize - 1] = startupLocality;
                bank[0] = seed;
            }
        }

        // ── 3. 逐事件 extend ──
        foreach (var evt in log.Events)
        {
            if (evt.EventType == 0x00000003) continue;  // EV_NO_ACTION 不参与 extend
            if (evt.PcrIndex == 0xFFFFFFFF) continue;

            foreach (var digest in evt.Digests)
            {
                if (!banks.TryGetValue(digest.AlgorithmId, out var bank)) continue;
                if (!bank.TryGetValue(evt.PcrIndex, out var current))
                    current = new byte[digest.Digest.Length];
                bank[evt.PcrIndex] = Extend(digest.AlgorithmId, current, digest.Digest);
            }
        }

        return banks;
    }

    private static byte[] Extend(ushort algId, byte[] pcr, byte[] digest)
    {
        var combined = new byte[pcr.Length + digest.Length];
        pcr.CopyTo(combined, 0);
        digest.CopyTo(combined, pcr.Length);
        using var hash = CreateHash(algId);
        return hash.ComputeHash(combined);
    }

    private static HashAlgorithm CreateHash(ushort algId) => algId switch
    {
        0x0004 => SHA1.Create(),
        0x000B => SHA256.Create(),
        0x000C => SHA384.Create(),
        0x000D => SHA512.Create(),
        0x0012 => new SM3(),
        _ => SHA256.Create(),
    };
}</script>

<script type="text/plain" id="code-1" data-lang="csharp">// Verifyer/Analyzers/SecurityFeatureAnalyzer.cs
// 1. Secure Boot — 从 PCR7 事件判定安全启动真实状态
private static SecurityFeature AnalyzeSecureBoot(TcgEventLog log)
{
    var feat = new SecurityFeature { Name = "Secure Boot" };

    // Find SecureBoot variable in PCR7
    var secureBootEvent = log.Events.FirstOrDefault(e =>
        e.PcrIndex == 7 &&
        (e.EventType == 0x80000001 || e.EventType == 0x800000E0) &&
        TryParseEfiVariable(e.EventData, out var v) &&
        v!.VariableGuid == EfiGlobalVariableGuid &&
        v.VariableName == "SecureBoot");

    if (secureBootEvent == null)
    {
        feat.Status = FeatureStatus.NotMeasured;
        feat.Evidence = "SecureBoot variable not found in PCR7";
        return feat;
    }

    TryParseEfiVariable(secureBootEvent.EventData, out var varData);
    bool enabled = varData?.VariableData?.Length > 0 && varData.VariableData[0] == 0x01;

    feat.Status = enabled ? FeatureStatus.Enabled : FeatureStatus.Disabled;
    feat.Evidence = $"Event #{secureBootEvent.Index} (PCR7, EFI_VARIABLE_DRIVER_CONFIG)";

    // Also check PK, KEK, db presence
    var pkEvent = log.Events.FirstOrDefault(e =>
        e.PcrIndex == 7 && TryParseEfiVariable(e.EventData, out var v) &&
        v!.VariableName == "PK");
    var dbEvent = log.Events.FirstOrDefault(e =>
        e.PcrIndex == 7 && TryParseEfiVariable(e.EventData, out var v) &&
        v!.VariableName == "db");
    var dbxEvent = log.Events.FirstOrDefault(e =>
        e.PcrIndex == 7 && TryParseEfiVariable(e.EventData, out var v) &&
        v!.VariableName == "dbx");

    var details = new List<string>();
    if (pkEvent != null)
    {
        TryParseEfiVariable(pkEvent.EventData, out var pk);
        details.Add($"PK measured (DataLen={pk?.VariableData?.Length ?? 0})");
    }
    if (dbEvent != null)
    {
        TryParseEfiVariable(dbEvent.EventData, out var db);
        details.Add($"db measured (DataLen={db?.VariableData?.Length ?? 0})");
    }
    if (dbxEvent != null)
    {
        TryParseEfiVariable(dbxEvent.EventData, out var dbx);
        details.Add($"dbx measured (DataLen={dbx?.VariableData?.Length ?? 0})");
    }

    feat.Detail = string.Join(", ", details);
    return feat;
}</script>

<script type="text/plain" id="code-2" data-lang="csharp">// Verifyer/RemoteVerify/PCRVerify.cs
// 执行完整的 PCR Quote 远程验证流程
public static async Task<PCRVerifyResult> RunAsync(
    Tpm2 tpm, HttpClient http, AKVerifyResult akResult)
{
    // ── Step 1: 向服务端请求 nonce ────────────────────────
    Console.WriteLine("[*] PCRVerify: POST /request_nonce...");
    nonceResp = await http.PostAsJsonAsync("/request_nonce", new
    {
        ak_name = Convert.ToBase64String(akResult.AkName),
    });

    string quoteSid = nonceBody.GetProperty("quote_sid").GetString()!;
    byte[] nonce = Convert.FromBase64String(nonceBody.GetProperty("nonce").GetString()!);

    // ── Step 2: 读取 WBCL（优先 TBS API，失败回退到文件）──
    Console.WriteLine("[*] PCRVerify: 读取 WBCL...");
    byte[] wbcl = ReadWbcl(tpm);
    Console.WriteLine($"    WBCL: {wbcl.Length} bytes");

    // ── Step 3: TPM2_Quote（PCR 0-14, nonce 嵌入 extraData）──
    Console.WriteLine("[*] PCRVerify: TPM2_Quote (TPM 硬件)...");
    (attestBytes, sigBytes) = DoQuote(tpm, akResult.AkHandle, nonce);

    // ── Step 4: 发送给服务端验证 ──────────────────────────
    Console.WriteLine("[*] PCRVerify: POST /verify_quote...");
    qResp = await http.PostAsJsonAsync("/verify_quote", new
    {
        quote_sid = quoteSid,
        attest = Convert.ToBase64String(attestBytes),
        sig = Convert.ToBase64String(sigBytes),
        wbcl = Convert.ToBase64String(wbcl),
    });

    bool sigValid = qBody.TryGetProperty("sig_valid", out var sv) && sv.GetBoolean();
    bool magicOk = qBody.TryGetProperty("magic_ok", out var mv) && mv.GetBoolean();
    bool nonceOk = qBody.TryGetProperty("nonce_ok", out var nov) && nov.GetBoolean();
    bool pcrMatch = qBody.TryGetProperty("pcr_match", out var pmv) && pmv.GetBoolean();
}

// ── TPM2_Quote：真实 TPM 硬件签名 ─────────────────────────
static (byte[] attest, byte[] sig) DoQuote(Tpm2 tpm, TpmHandle akHandle, byte[] nonce)
{
    var pcrSelBytes = new byte[3];
    foreach (var i in QuotedPcrs)
        pcrSelBytes[i / 8] |= (byte)(1 << (int)(i % 8));

    var pcrSel = new PcrSelection(TpmAlgId.Sha256, pcrSelBytes);

    // Quote 返回 Attest 对象，签名通过 out 参数
    Attest quoted = tpm.Quote(
        akHandle,
        qualifyingData: nonce,
        inScheme: new SchemeRsassa(TpmAlgId.Sha256),
        PCRselect: new[] { pcrSel },
        signature: out ISignatureUnion signature);

    // 把 Attest 序列化成字节（服务端需要 marshal 后的原始字节来验证签名）
    byte[] attestBytes = quoted.GetTpmRepresentation();

    byte[] sigBytes = ((SignatureRsassa)signature).sig;
    return (attestBytes, sigBytes);
}

// ── 服务端四步验证结果 ────────────────────────────────────
static void PrintDetails(bool sigValid, bool magicOk, bool nonceOk, bool pcrMatch, ...)
{
    Console.WriteLine($"\n    ① AK 签名  : {(sigValid ? "✔ 有效" : "✘ 无效")}");
    Console.WriteLine($"    ② TPM magic: {(magicOk ? "✔ 0xFF544347" : "✘ 不匹配")}");
    Console.WriteLine($"    ③ nonce    : {(nonceOk ? "✔ 一致" : "✘ 不一致（疑似重放）")}");
    Console.WriteLine($"    ④ PCR重放  : {(pcrMatch ? "✔ 一致" : "✘ 不一致（WBCL可能被篡改）")}");
}</script>

<script type="text/plain" id="code-3" data-lang="csharp">// Verifyer/Analyzers/SecurityFeatureAnalyzer.cs
// 4. HVCI / VBS (Hypervisor-protected Code Integrity)
private static SecurityFeature AnalyzeHvci(TcgEventLog log)
{
    var feat = new SecurityFeature { Name = "HVCI / VBS (Hypervisor Code Integrity)" };
    var wbclEvents = WbclParser.ParseAll(log);
    var evidences = new List<string>();
    bool hvciDetected = false;

    // ── Evidence 1: Hypervisor Launch Type ──
    // Legacy tag: SIPAEVENT_HYPERVISOR_LAUNCH_TYPE = 0x00080001
    // Win11 V2 tag: 0x00020008 (inside 0x40010001 aggregation)
    var launchTypeEvent = wbclEvents.FirstOrDefault(e =>
        e.EventId == 0x00080001 || e.EventId == 0x00020008);

    if (launchTypeEvent != null)
    {
        uint launchType = BitConverter.ToUInt32(launchTypeEvent.EventData, 0);

        string launchDesc = launchType switch
        {
            0 => "Hyper-V not launched",
            1 => "Hyper-V launched (VT-x occupied)",
            2 => "Launched with virtualization extensions",
            _ => $"Unknown ({launchType})"
        };

        evidences.Add($"Chain 1: HypervisorLaunchType={launchType} ({launchDesc}) " +
                      $"[0x{launchTypeEvent.EventId:X8}, PCR{launchTypeEvent.SourcePcr}]");

        if (launchType >= 1)
            hvciDetected = true;
    }

    // ── Evidence 2: VBS / HVCI flags ──
    // Legacy tag: SIPAEVENT_VBS_STATUS = 0x000A0001
    // Win11 V2 tag: 0x0005000A (VBS flags, 8 bytes LE)
    var vbsFlagsEvent = wbclEvents.FirstOrDefault(e =>
        e.EventId == 0x000A0001 || e.EventId == 0x0005000A);

    if (vbsFlagsEvent != null)
    {
        ulong vbsFlags = BitConverter.ToUInt64(vbsFlagsEvent.EventData, 0);

        bool vbsEnabled = (vbsFlags & 0x01) != 0;
        bool vbsRequired = (vbsFlags & 0x02) != 0;
        bool hvciEnabled = (vbsFlags & 0x04) != 0;

        var flagStrs = new List<string>();
        if (vbsEnabled) flagStrs.Add("VBS=ON");
        if (vbsRequired) flagStrs.Add("VBS_REQUIRED");
        if (hvciEnabled) flagStrs.Add("HVCI=ON");

        evidences.Add($"Chain 2: VBS/HVCI flags=0x{vbsFlags:X} ({string.Join(", ", flagStrs)}) " +
                      $"[0x{vbsFlagsEvent.EventId:X8}, PCR{vbsFlagsEvent.SourcePcr}]");

        if (vbsEnabled || hvciEnabled)
            hvciDetected = true;
    }

    // ── Evidence 3: PCR12 replay integrity ──
    bool hasPcr12 = log.Events.Any(e => e.PcrIndex == 12);
    if (hasPcr12)
        evidences.Add("Chain 3: PCR12 events present — replay match verified in PCR Banks");

    // ── Final verdict ──
    if (hvciDetected && hasPcr12)
    {
        feat.Status = FeatureStatus.Enabled;
        feat.Evidence = "HVCI/VBS is active — Hyper-V occupying VT-x, PCR12 integrity verified";
    }
    else if (hvciDetected)
    {
        feat.Status = FeatureStatus.Enabled;
        feat.Evidence = "HVCI/VBS detected from WBCL flags (PCR12 replay not available)";
    }
    else
    {
        feat.Status = FeatureStatus.NotMeasured;
        feat.Evidence = "No HVCI/VBS markers found in WBCL";
    }

    feat.Detail = string.Join("\n         ", evidences);
    return feat;
}</script>

<script type="text/plain" id="code-4" data-lang="csharp">// Tracker/Services/SignatureVerifier.cs
// 签名验证：先试 Authenticode，再试目录签名 (Catalog)
private static unsafe (bool Trusted, string Info) VerifyFileSignature(string filePath)
{
    if (!File.Exists(filePath))
        return (false, "文件不存在");

    // 1. 先试 Authenticode（PE 内嵌签名）
    var hr = VerifyAuthenticode(filePath);
    if (hr == 0)
        return (true, "Authenticode 签名有效");

    // 用户明确不信任 → 直接失败，不试目录签名
    if (hr == TRUST_E_EXPLICIT_DISTRUST)
        return (false, "签名已被用户明确不信任");

    // 2. Authenticode 失败 → 试目录签名（独立的信任路径）
    if (VerifyCatalog(filePath))
        return (true, "目录签名有效 (Catalog Signed)");

    // 3. 两种签名都没有
    return hr switch
    {
        TRUST_E_NOSIGNATURE => (false, "未签名 (Authenticode + Catalog 均无)"),
        TRUST_E_SUBJECT_NOT_TRUSTED => (false, "签名不受信任"),
        CERT_E_EXPIRED => (false, "签名证书已过期"),
        CERT_E_CHAINING => (false, "无法构建证书链"),
        _ => (false, $"验证失败 (hr=0x{hr:X8})"),
    };
}

// ── Authenticode 签名验证 ─────────────────────────────────
private static unsafe int VerifyAuthenticode(string filePath)
{
    Guid guidAction = new("00AAC56B-CD44-11d0-8CC2-00C04FC295EE");

    fixed (char* pFile = filePath)
    {
        var fileInfo = new WINTRUST_FILE_INFO
        {
            cbStruct = (uint)sizeof(WINTRUST_FILE_INFO),
            pcwszFilePath = (nint)pFile,
        };

        var trustData = new WINTRUST_DATA
        {
            cbStruct = (uint)sizeof(WINTRUST_DATA),
            dwUIChoice = WTD_UI_NONE,
            dwUnionChoice = WTD_CHOICE_FILE,
            pFile = (nint)(&fileInfo),
            dwProvFlags = WTD_SAFER_FLAG,
        };

        return WinVerifyTrust(-1, &guidAction, &trustData);
    }
}

// ── 目录签名验证 (Windows Catalog .cat) ────────────────────
private static unsafe bool VerifyCatalog(string filePath)
{
    IntPtr catAdmin;
    fixed (Guid* pGuid = &DRIVER_VERIFY_GUID)
    {
        if (!CryptCATAdminAcquireContext(&catAdmin, pGuid, 0))
            return false;
    }

    using var fs = new FileStream(filePath, FileMode.Open, FileAccess.Read, FileShare.Read);
    var handle = fs.SafeFileHandle;

    // 第一次调用：获取哈希大小；第二次调用：计算哈希
    uint hashSize = 0;
    CryptCATAdminCalcHashFromFileHandle(handle, ref hashSize, (byte*)0, 0);

    var hashBuf = new byte[hashSize];
    fixed (byte* pHash = hashBuf)
    {
        if (!CryptCATAdminCalcHashFromFileHandle(handle, ref hashSize, pHash, 0))
            return false;

        // 在所有已注册的目录中查找该哈希
        IntPtr catInfo = CryptCATAdminEnumCatalogFromHash(catAdmin, pHash, hashSize, 0, IntPtr.Zero);
        if (catInfo == IntPtr.Zero)
            return false; // 不在任何目录中

        // 找到了 → 有目录签名
        CryptCATAdminReleaseCatalogContext(catAdmin, catInfo, 0);
        return true;
    }
}</script>

<script type="text/plain" id="code-5" data-lang="c">// KernelService/DriverVerify.c
// 校验发起 IOCTL 的进程映像文件 SHA256 是否匹配白名单
NTSTATUS VerifyRequestorImageHash(_In_ WDFREQUEST Request)
{
    PIRP      irp     = WdfRequestWdmGetIrp(Request);
    PEPROCESS process = (irp != NULL) ? IoGetRequestorProcess(irp) : NULL;

    if (process == NULL) {
        DbgPrintEx(DPFLTR_DEFAULT_ID, DPFLTR_WARNING_LEVEL,
            "[KernelService] Verify: cannot resolve requestor process -> DENIED\n");
        return STATUS_ACCESS_DENIED;
    }

    // 1. 取进程映像文件对象
    PFILE_OBJECT fileObject = NULL;
    NTSTATUS status = PsReferenceProcessFilePointer(process, &fileObject);
    if (!NT_SUCCESS(status) || fileObject == NULL)
        return STATUS_ACCESS_DENIED;

    // 2. 取映像完整磁盘路径
    POBJECT_NAME_INFORMATION nameInfo = NULL;
    status = IoQueryFileDosDeviceName(fileObject, &nameInfo);
    ObDereferenceObject(fileObject);

    // 3. 以内核句柄重新打开该磁盘文件
    HANDLE fileHandle = NULL;
    OBJECT_ATTRIBUTES oa;
    IO_STATUS_BLOCK iosb;
    InitializeObjectAttributes(&oa, &nameInfo->Name,
        OBJ_CASE_INSENSITIVE | OBJ_KERNEL_HANDLE, NULL, NULL);

    status = ZwCreateFile(&fileHandle,
        FILE_READ_DATA | FILE_READ_ATTRIBUTES,
        &oa, &iosb, NULL, FILE_ATTRIBUTE_NORMAL,
        FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE,
        FILE_OPEN,
        FILE_NON_DIRECTORY_FILE | FILE_SYNCHRONOUS_IO_NONALERT,
        NULL, 0);

    // 4. 计算 SHA256 并比对
    UCHAR actual[32];
    RtlZeroMemory(actual, sizeof(actual));

    status = ComputeFileSha256(fileHandle, actual);
    ZwClose(fileHandle);

    if (RtlCompareMemory(actual, g_AllowedImageSha256, 32) != 32) {
        DbgPrintEx(DPFLTR_DEFAULT_ID, DPFLTR_WARNING_LEVEL,
            "[KernelService] Verify: SHA256 mismatch for '%wZ' -> DENIED\n", &nameInfo->Name);
        ExFreePool(nameInfo);
        return STATUS_ACCESS_DENIED;
    }

    DbgPrintEx(DPFLTR_DEFAULT_ID, DPFLTR_INFO_LEVEL,
        "[KernelService] Verify: SHA256 OK for '%wZ' -> ALLOWED\n", &nameInfo->Name);
    ExFreePool(nameInfo);
    return STATUS_SUCCESS;
}

// 内部: 对文件句柄做 SHA256 流式哈希（CNG / BCrypt, dispatch 级）
static NTSTATUS ComputeFileSha256(
    _In_ HANDLE FileHandle,
    _Out_writes_bytes_all_(32) UCHAR Hash[32])
{
    BCRYPT_ALG_HANDLE  hAlg    = NULL;
    BCRYPT_HASH_HANDLE hHash   = NULL;

    // BCRYPT_PROV_DISPATCH: 内核态调用方必须指定,确保走 dispatch 表
    status = BCryptOpenAlgorithmProvider(
        &hAlg, BCRYPT_SHA256_ALGORITHM, NULL, BCRYPT_PROV_DISPATCH);

    status = BCryptCreateHash(hAlg, &hHash, pHashObj, cbHashObj, NULL, 0, 0);

    // 分块读文件并喂给 hash
    status = BCryptHashData(hHash, buf, cbRead, 0);

    status = BCryptFinishHash(hHash, Hash, 32, 0);
}</script>
